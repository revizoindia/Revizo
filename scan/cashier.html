<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cashier Terminal</title>
<style>
  :root { --bg: #1a1a1a; --card: #252525; --text: #ffffff; }
  @media (prefers-color-scheme: light) { :root { --bg: #e0e0e0; --card: #ffffff; --text: #000000; } }

  body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
  .card { background: var(--card); width: 100%; max-width: 500px; padding: 30px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); text-align: center; display: none; box-sizing: border-box; margin: 0 auto; }
  .active { display: block; }
  
  .futuristic-btn { position: relative; border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 50px; color: #000000 !important; font-weight: 900; font-size: clamp(16px, 4vw, 20px); letter-spacing: 1px; padding: 18px 20px; width: 100%; cursor: pointer; transition: all 0.3s ease; }
  .futuristic-btn:active { transform: scale(0.95) !important; }

  .stats-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat-box { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 12px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 900; color: #00ff87; }
  .list-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px 20px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left;}
  .crm-card { border-left: 4px solid #ff8a00; }
  .btn-approve { background: #25D366; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  .btn-reject { background: rgba(255,59,48,0.2); color: #ff3b30; border: 1px solid rgba(255,59,48,0.5); padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  .pin-input { width: 100%; padding: 16px; font-size: 28px; text-align: center; letter-spacing: 12px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: var(--text); margin-bottom: 20px; outline: none; }
</style>
</head>
<body>

<div id="cashier-view" style="width: 100%; max-width: 500px;">
  <div id="cashier-login" class="card active">
    <h2 style="margin-top:0;">Cashier Terminal</h2>
    <p style="opacity:0.7;">Enter 4-Digit PIN</p>
    <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
    <button id="unlockBtn" class="futuristic-btn" style="background:#00c6ff;" onclick="unlockDashboard()">UNLOCK TERMINAL</button>
  </div>

  <div id="cashier-dashboard" class="card" style="display:none; text-align: left;">
    <div style="text-align:center; margin-bottom:20px;"><h2 style="margin:0;">🛒 Dashboard</h2></div>
    <div class="stats-bar">
      <div class="stat-box"><div class="stat-num" id="statToday">0</div><div style="font-size:11px; text-transform:uppercase; opacity:0.7;">Visits Today</div></div>
      <div class="stat-box"><div class="stat-num" id="statVIPs" style="color:#00c6ff;">0</div><div style="font-size:11px; text-transform:uppercase; opacity:0.7;">Total VIPs</div></div>
    </div>
    
    <div id="remindersSection" style="display:none; margin-bottom:25px;">
      <h3 style="color:#a0aec0; font-size:14px; text-transform:uppercase;">📅 CRM Event Alerts</h3>
      <div id="reminderList"></div>
    </div>
    
    <h3 style="color:#a0aec0; font-size:14px; text-transform:uppercase;">⏳ Pending Verifications</h3>
    <div id="pendingList"></div>
  </div>
</div>

<script>
  const REVIZO_API = "https://script.google.com/macros/s/AKfycbyxbGnwYbRkO1-tUPkY7PVhuc0HNPo4QXtOLukwQk2RSXzvM5SEiVdW8cDN_y0r0-MZ/exec"; 
  const urlParams = new URLSearchParams(window.location.search);
  const SHOP_ID = urlParams.get('shop') || 'NEWRIWAZ'; 
  let authToken = localStorage.getItem('revizo3_auth_' + SHOP_ID) || '';

  window.onload = function() {
    if(authToken) launchDashboard();
  };

  function unlockDashboard() {
    const pin = document.getElementById('pinInput').value;
    if(pin.length < 4) return;
    document.getElementById('unlockBtn').innerText = 'CHECKING...';
    
    fetch(REVIZO_API + "?action=getCashierData&shopId=" + SHOP_ID + "&auth=" + pin)
      .then(r => r.json()).then(data => {
        if(data.error) {
          alert("Invalid PIN"); document.getElementById('pinInput').value = ''; document.getElementById('unlockBtn').innerText = 'UNLOCK TERMINAL';
        } else { authToken = pin; localStorage.setItem('revizo3_auth_' + SHOP_ID, pin); launchDashboard(); }
      }).catch(() => { document.getElementById('unlockBtn').innerText = 'UNLOCK TERMINAL'; alert("Network Error"); });
  }

  function launchDashboard() {
    document.getElementById('cashier-login').classList.remove('active');
    document.getElementById('cashier-dashboard').style.display = 'block';
    loadPending(); setInterval(() => { if(!document.hidden) loadPending(); }, 8000);
  }

  function loadPending() {
    fetch(REVIZO_API + "?action=getCashierData&shopId=" + SHOP_ID + "&auth=" + authToken)
      .then(r => r.json()).then(data => {
        if(!data.error) { document.getElementById('statToday').innerText = data.data.stats.today; document.getElementById('statVIPs').innerText = data.data.stats.vips; renderList(data.data.pending, data.data.reminders); }
      });
  }

  function renderList(pending, reminders) {
    const list = document.getElementById('pendingList'); list.innerHTML = '';
    if(pending && pending.length > 0) {
      pending.forEach(num => {
        const masked = '******' + String(num).slice(-4);
        list.innerHTML += `<div class='list-card' id='card-${num}'><div style='font-size:20px; font-weight:bold;'>${masked}</div><div style='display:flex; gap:8px;'><button class='btn-reject' onclick='rejectReq("${num}")'>❌</button><button class='btn-approve' onclick='approveReq("${num}")'>✓ APPROVE</button></div></div>`;
      });
    } else { list.innerHTML = "<div style='color:#888; text-align:center;'>No pending verifications...</div>"; }
    
    const remList = document.getElementById('reminderList'); remList.innerHTML = '';
    if(reminders && reminders.length > 0) {
      document.getElementById('remindersSection').style.display = 'block';
      reminders.forEach(rem => {
        const msg = encodeURIComponent(`Hi ${rem.name}! Your ${rem.type} is ${rem.time} away! Claim VIP offers at the store.`);
        remList.innerHTML += `<div class='list-card crm-card'><div><div style='font-weight:bold;'>${rem.name}</div><div style='font-size:12px; color:#00ff87;'><b>${rem.time}</b> to ${rem.type}</div></div><a href='https://wa.me/91${rem.mobile}?text=${msg}' target='_blank' style='background:#25D366; color:#fff; padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:bold;'>💬 MSG</a></div>`;
      });
    } else { document.getElementById('remindersSection').style.display = 'none'; }
  }

  function approveReq(mobile) {
    document.getElementById('card-'+mobile).style.opacity = '0.5';
    fetch(REVIZO_API + "?action=approveUser&shopId=" + SHOP_ID + "&mobile=" + mobile + "&auth=" + authToken).then(r => r.json()).then(d => { if(d.success) document.getElementById('card-'+mobile).remove(); loadPending(); });
  }

  function rejectReq(mobile) {
    document.getElementById('card-'+mobile).style.opacity = '0.5';
    fetch(REVIZO_API + "?action=rejectUser&shopId=" + SHOP_ID + "&mobile=" + mobile + "&auth=" + authToken).then(r => r.json()).then(d => { if(d.success) document.getElementById('card-'+mobile).remove(); loadPending(); });
  }
</script>
</body>
</html>

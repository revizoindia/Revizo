<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Connect</title>
    <style>
        body, html {margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f0f4f8;}
        iframe {width: 100%; height: 100%; border: none;}
    </style>
</head>
<body>
    <iframe id="appFrame" 
            allow="geolocation; microphone; camera; midi; encrypted-media" 
            style="width:100%; height:100%; border:none;">
    </iframe>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopID = urlParams.get('shop') || '';
        const page = urlParams.get('page') || '';
        
        // Your Web App URL
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyxbGnwYbRkO1-tUPkY7PVhuc0HNPo4QXtOLukwQk2RSXzvM5SEiVdW8cDN_y0r0-MZ/exec";
        
        // This forces the PIN 1111 every time
        const authPin = "1111"; 
        
        // Build the URL with Shop, Page, AND Auth PIN
        let finalUrl = scriptUrl + "?shop=" + shopID + "&auth=" + authPin;
        if(page) finalUrl += "&page=" + page;
        
        document.getElementById("appFrame").src = finalUrl;
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Rewards</title>
    <style>body, html {margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a;}</style>
</head>
<body>
    <iframe id="appFrame" style="width:100%; height:100%; border:none;"></iframe>
    <script>
        // This magic script reads your link and connects to your Google Sheet!
        const urlParams = new URLSearchParams(window.location.search);
        const shopID = urlParams.get('shop') || '';
        const page = urlParams.get('page') || '';
        
        // Your Master V3 Google Link
        let scriptUrl = "https://script.google.com/macros/s/AKfycbyxbGnwYbRkO1-tUPkY7PVhuc0HNPo4QXtOLukwQk2RSXzvM5SEiVdW8cDN_y0r0-MZ/exec";
        
        // Connect them together
        let finalUrl = scriptUrl + "?shop=" + shopID;
        if(page) finalUrl += "&page=" + page;
        
        document.getElementById("appFrame").src = finalUrl;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIP Rewards Wallet</title>
<style>
  :root { --bg: #f0f4f8; --card: #ffffff; --text: #000000; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --card: #252525; --text: #ffffff; } }

  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; overflow-x: hidden; min-height: 90vh; align-items: center; transition: background-color 0.5s;}
  .container { width: 100%; max-width: 440px; background: var(--card); padding: 20px 15px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; box-sizing: border-box; margin: auto; display: none; }
  .active { display: block; }
  
  /* 2050 FULL GLOSSY BUTTONS */
  .btn-2050 { position: relative; width: 100%; padding: 18px 10px; border-radius: 20px; font-size: 17px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(255, 255, 255, 0.5); cursor: pointer; overflow: hidden; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); box-sizing: border-box; text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-top: 15px; display: block; }
  .btn-2050::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%; background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0)); border-radius: 20px 20px 100px 100px / 20px 20px 25px 25px; pointer-events: none; }
  .btn-2050:active { transform: scale(0.95); }
  .btn-2050:disabled { background: #888 !important; box-shadow: none !important; cursor: not-allowed; border-color: #555; }
      
  /* SPECIFIC BUTTON COLORS */
  .neon-green { background: linear-gradient(135deg, #00ff87, #00b75a); box-shadow: 0 12px 25px rgba(0, 255, 135, 0.4), inset 0 -3px 10px rgba(0,0,0,0.1); }
  .neon-orange { background: linear-gradient(135deg, #ff8a00, #e52e71); box-shadow: 0 12px 25px rgba(229, 46, 113, 0.4), inset 0 -3px 10px rgba(0,0,0,0.1); }
  .neon-blue { background: linear-gradient(135deg, #00c6ff, #0072ff); box-shadow: 0 12px 25px rgba(0, 114, 255, 0.4), inset 0 -3px 10px rgba(0,0,0,0.1); }

  .fancy-card { border-radius: 15px; padding: 15px; margin-bottom: 12px; color: white; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
  .c-purple { background: linear-gradient(135deg, #8E54E9, #4776E6); }
  .c-green { background: linear-gradient(135deg, #00b09b, #96c93d); }
  .c-blue { background: linear-gradient(135deg, #00c6ff, #0072ff); }
  
  .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
  .bg-warning { background: #fff3cd; color: #856404; border: 1px solid #856404;}
  .bg-success { background: #d4edda; color: #155724; border: 1px solid #155724;}
  
  .visit-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
  .visit-row:last-child { border-bottom: none; }
  .tag-done { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 12px; }
  .tag-surprise { background: #ffd700; color: #000; padding: 4px 10px; border-radius: 8px; font-size: 12px; animation: pulse 1.5s infinite; }
  
  .congrats-box { background: linear-gradient(135deg, #FFD700, #FFA500); padding: 20px; border-radius: 15px; margin-top: 15px; margin-bottom: 15px; color: #000; box-shadow: 0 5px 15px rgba(255,165,0,0.4); animation: popIn 0.5s ease; border: 2px solid #fff; display: none;}
  
  @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div id="step-loading" class="container active"><h2>⏳ Securely Loading...</h2></div>

<div id="step-wallet" class="container">
  
  <img id="shopLogo" src="https://i.ibb.co/TMjycHLN/ei-1780753422474-removebg-preview.png" style="max-width: 120px; max-height: 120px; border-radius: 30px; margin-bottom: 15px; object-fit: contain;">
  
  <h2 id="greetingText" style="margin-top:0; font-weight:900;">My Rewards Wallet</h2>
  <div id="visitStatus" class="status-badge"></div>

  <div class="fancy-card c-purple">
    <div style="font-size: 10px; opacity: 0.9; letter-spacing: 1px;">MONTHLY LUCKY DRAW</div>
    <div style="font-size: 16px; font-weight: 900; margin-top: 4px;">LIFETIME ENTRY CONFIRMED ✅</div>
  </div>

  <div class="fancy-card c-green">
    <div style="font-size: 10px; opacity: 0.9; letter-spacing: 1px;">YOUR NEXT-BUY COUPON</div>
    <div id="revVoucher" style="font-size: 22px; font-weight: 900; margin-top: 4px;">...</div>
  </div>

  <div class="fancy-card c-blue">
    <div style="font-size: 10px; opacity: 0.9; margin-bottom: 10px; letter-spacing: 1px;">STAMP JOURNEY (<span id="stampCountText">0</span>/5)</div>
    <div id="journeyList"></div>
  </div>

  <div id="congratsBox" class="congrats-box">
    <h2 style="margin: 0 0 10px 0; font-size: 24px;">🎉 CONGRATULATIONS! 🎉</h2>
    <p style="font-size: 16px; margin-bottom: 10px;">You completed 5 visits!</p>
    <div style="background: white; padding: 10px; border-radius: 8px; font-weight: 900; font-size: 16px; color: #d32f2f;">
      Show this screen to the cashier to get your SURPRISE REWARD! 🎁
    </div>
  </div>

  <button id="newStampBtn" class="btn-2050 neon-blue" onclick="requestNewStamp()">📍 I'M AT THE SHOP - LOG VISIT</button>
  
  <a id="dynamicWaBtn" href="#" target="_blank" style="text-decoration: none; display: none;">
    <button type="button" class="btn-2050 neon-orange">💬 JOIN VIP WHATSAPP GROUP</button>
  </a>
</div>

<script>
  const REVIZO_API = "https://script.google.com/macros/s/AKfycbyxbGnwYbRkO1-tUPkY7PVhuc0HNPo4QXtOLukwQk2RSXzvM5SEiVdW8cDN_y0r0-MZ/exec"; 
  const urlParams = new URLSearchParams(window.location.search);
  const SHOP_ID = urlParams.get('shop') || 'NEWRIWAZ'; 
  const savedMobile = localStorage.getItem("revizo3_mobile");

  // SOLUTION 1: WHATSAPP LINKS LOADED INTO MEMORY
  const VISITOR_LINKS = {
      "default": "PASTE_LINK_DEFAULT",
      "16 to 20": "PASTE_LINK_16_20",
      "21 to 25": "PASTE_LINK_21_25",
      "26 to 35": "PASTE_LINK_26_35",
      "36 to 44": "PASTE_LINK_36_44",
      "45 to 55": "PASTE_LINK_45_55"
  };

  window.onload = function() {
    if (!savedMobile) {
      window.location.href = "index.html?shop=" + SHOP_ID;
      return;
    }
    fetch(REVIZO_API + "?action=checkWallet&shopId=" + SHOP_ID + "&mobile=" + savedMobile)
      .then(r => r.json()).then(d => { 
          if(d.status !== "NOT_FOUND") showRewards(d); 
          else { window.location.href = "index.html?shop=" + SHOP_ID; } 
      }).catch(() => { alert("Network Error Loading Wallet"); });
  };

  function requestNewStamp() {
    var btn = document.getElementById("newStampBtn");
    let lastSub = sessionStorage.getItem('last_stamp_req');
    if(lastSub && (Date.now() - lastSub < 10000)) return alert("Wait before requesting again.");
    sessionStorage.setItem('last_stamp_req', Date.now());

    btn.disabled = true; btn.innerHTML = "⏳ REQUESTING...";
    
    fetch(REVIZO_API + "?action=submitVisit&shopId=" + SHOP_ID + "&mobile=" + savedMobile).then(r => r.json()).then(data => {
      if(data.status === "RATE_LIMITED") { alert("Too many requests."); btn.disabled=false; btn.innerHTML="📍 I'M AT THE SHOP - LOG VISIT"; return; }
      
      // ANTI-FRAUD 24 HOUR LOCK
      if (data.status === "ALREADY_APPROVED") {
        btn.innerHTML = "⏳ COME BACK TOMORROW";
        btn.disabled = true;
        document.getElementById("visitStatus").innerText = "✅ Limit Reached For Today"; 
        document.getElementById("visitStatus").className = "status-badge bg-success";
        return;
      }

      if (data.status === "SUCCESS" || data.status === "ALREADY_PENDING") {
        btn.innerHTML = "⏳ WAITING...";
        document.getElementById("visitStatus").innerText = "⏳ Waiting for cashier..."; 
        document.getElementById("visitStatus").className = "status-badge bg-warning";
        waitForCashier(savedMobile);
      } else { 
        fetch(REVIZO_API + "?action=checkWallet&shopId=" + SHOP_ID + "&mobile=" + savedMobile).then(r => r.json()).then(showRewards); 
      }
    }).catch(() => { btn.disabled=false; btn.innerHTML="📍 I'M AT THE SHOP - LOG VISIT"; alert("Network error."); });
  }

  function waitForCashier(mobile) {
    let checkInterval = setInterval(() => {
      fetch(REVIZO_API + "?action=checkWallet&shopId=" + SHOP_ID + "&mobile=" + mobile).then(r => r.json()).then(data => { 
        if(data.status === "APPROVED" || data.status === "CLAIMED") { clearInterval(checkInterval); showRewards(data); } 
      });
    }, 4000);
  }

  function showRewards(data) {
    document.getElementById("step-loading").classList.remove('active'); 
    document.getElementById("step-wallet").classList.add('active');
    
    // CUSTOMER FIRST NAME
    if(data.customerName) {
        document.getElementById("greetingText").innerText = "Hello, " + data.customerName.split(" ")[0] + "!";
    }
    
    // AGE-SPECIFIC WHATSAPP LINK ACTIVATION (SOLUTION 1)
    let waLink = data.dynamicWaLink || localStorage.getItem("saved_wa_link");
    if (!waLink || waLink === "") {
        let cat = data.category || "default";
        waLink = VISITOR_LINKS[cat] || VISITOR_LINKS["default"];
    }
    if(waLink && !waLink.includes("PASTE_LINK")) {
        document.getElementById("dynamicWaBtn").href = waLink;
        document.getElementById("dynamicWaBtn").style.display = "block";
    }
    
    let sCount = data.stamps || 0; 
    let vText = data.voucher ? data.voucher.toString().toUpperCase() : "";
    
    if(vText === "TRY AGAIN" || vText === "JACKPOT" || vText.includes("FREE")) {
        document.getElementById("revVoucher").innerHTML = vText;
    } else {
        document.getElementById("revVoucher").innerHTML = "<span style='font-size: 16px; opacity: 0.8;'>₹</span> " + vText + " <span style='font-size: 14px; opacity: 0.8;'>OFF</span>";
    }
    document.getElementById("stampCountText").innerText = sCount;
    
    // CUSTOM PRICING FOR VISITS (0 on 1st, Exact ₹ amounts on 2nd-5th)
    const rewardPrices = [0, 50, 75, 100, 150]; 
    let journeyHTML = ""; 
    for(let i = 1; i <= 5; i++) {
      if(i <= sCount) {
        if(i === 1) {
            journeyHTML += `<div class="visit-row">✅ VISIT 1 <span class="tag-done">Joined</span></div>`;
        } else {
            journeyHTML += `<div class="visit-row">✅ VISIT ${i} <span class="tag-done">₹${rewardPrices[i-1]} Redeemed</span></div>`;
        }
      } else if (i === 5) {
        journeyHTML += `<div class="visit-row" style="opacity: 0.6;">⬜ VISIT 5 <span class="tag-surprise">🎁 ₹${rewardPrices[i-1]} Reward</span></div>`;
      } else {
        journeyHTML += `<div class="visit-row" style="opacity: 0.6;">⬜ VISIT ${i} <span style="font-size:12px;">₹${rewardPrices[i-1]} Reward</span></div>`;
      }
    }
    document.getElementById("journeyList").innerHTML = journeyHTML;
    
    document.getElementById("congratsBox").style.display = (sCount >= 5) ? "block" : "none";
    
    let nBtn = document.getElementById("newStampBtn");
    
    if(data.status === "APPROVED" || data.status === "CLAIMED") {
      document.getElementById("visitStatus").innerText = "✅ Loyalty Card Up to Date"; 
      document.getElementById("visitStatus").className = "status-badge bg-success";
      nBtn.disabled = true; nBtn.innerHTML = "⏳ COME BACK TOMORROW";
    } else if (data.status === "PENDING") {
      document.getElementById("visitStatus").innerText = "⏳ Waiting for cashier..."; 
      document.getElementById("visitStatus").className = "status-badge bg-warning";
      nBtn.disabled = true; nBtn.innerHTML = "⏳ WAITING...";
    } else {
      nBtn.disabled = false; nBtn.innerHTML = "📍 I'M AT THE SHOP - LOG VISIT";
    }
  }
</script>
</body>
</html>

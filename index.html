<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Rewards Portal</title>
  <link id="dynamic-favicon" rel="icon" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">
  <link id="dynamic-manifest" rel="manifest" href="">
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f4f8; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="app-frame" src=""></iframe>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'SHOP1';
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsACkMhtohSGiImCyid7VUt1H72nPDF-ONZK2V8XkJfofF9iS7Voq-aOyRZfgwQyP7/exec";

    document.getElementById('app-frame').src = SCRIPT_URL + '?' + urlParams.toString();

    fetch(`${SCRIPT_URL}?action=getShopMeta&shop=${shopId}`)
      .then(res => res.json())
      .then(data => {
        if(data.shopName) document.title = data.shopName;
        if(data.logoUrl) {
          document.getElementById('dynamic-favicon').href = data.logoUrl;
          document.getElementById('dynamic-apple-icon').href = data.logoUrl;
          
          // THE MAGIC TRICK: Force Android to recognize the dynamic app icon
          const manifestJSON = {
            "name": data.shopName || "Rewards App",
            "short_name": data.shopName || "Rewards",
            "display": "standalone",
            "start_url": window.location.href,
            "icons": [{
              "src": data.logoUrl,
              "sizes": "192x192 512x512",
              "type": "image/jpeg"
            }]
          };
          const blob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
          document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
        }
      })
      .catch(err => console.log("Meta load error", err));
  </script>

</body>
</html>

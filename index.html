<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Rewards Portal</title>
  <link id="dynamic-favicon" rel="icon" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">
  
  <style>
    /* This strips away all borders and makes the iframe act like a native app */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f4f8; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="app-frame" src=""></iframe>

  <script>
    // 1. Grab all parameters from the URL (shop, page, and auth token)
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'SHOP1';

    // 2. Your Master Google Apps Script Web App Link
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsACkMhtohSGiImCyid7VUt1H72nPDF-ONZK2V8XkJfofF9iS7Voq-aOyRZfgwQyP7/exec";

    // 3. Inject ALL parameters into the iframe (This passes the hidden ?auth=1234 to the cashier securely)
    document.getElementById('app-frame').src = SCRIPT_URL + '?' + urlParams.toString();

    // 4. Secretly ask the Google Sheet for this specific shop's logo
    fetch(`${SCRIPT_URL}?action=getShopMeta&shop=${shopId}`)
      .then(res => res.json())
      .then(data => {
        if(data.shopName) document.title = data.shopName;
        if(data.logoUrl) {
          // 5. Update the invisible iOS/Android app icons so "Add to Home Screen" uses the client's actual logo
          document.getElementById('dynamic-favicon').href = data.logoUrl;
          document.getElementById('dynamic-apple-icon').href = data.logoUrl;
        }
      })
      .catch(err => console.log("Meta load error", err));
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revizo">
  <meta name="application-name" content="Revizo">
  <meta name="theme-color" content="#f0f4f8">
  
  <title>Revizo Rewards</title>
  
  <link rel="icon" sizes="192x192" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">
  <link rel="shortcut icon" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">

  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%20%22name%22%3A%20%22Revizo%20Rewards%22%2C%20%22short_name%22%3A%20%22Revizo%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22start_url%22%3A%20%22.%2F%22%2C%20%22icons%22%3A%20%5B%7B%20%22src%22%3A%20%22https%3A%2F%2Fi.ibb.co%2FcSFSkRSZ%2F20260506-124457.png%22%2C%20%22sizes%22%3A%20%22192x192%20512x512%20any%22%2C%20%22type%22%3A%20%22image%2Fpng%22%20%7D%5D%20%7D'>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f4f8; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="app-frame" src=""></iframe>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'SHOP1';
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz05XI5gdV_RlCXaIzgGn2PFL0TZwMNiPIb4clA7v_P1wUl-gN-Yin7B5Zqh5r3pxxQ/exec";

    // Inject the customer/shop data into the invisible iframe
    document.getElementById('app-frame').src = SCRIPT_URL + '?' + urlParams.toString();

    // Dynamically change the top browser tab name to the client's shop name
    fetch(`${SCRIPT_URL}?action=getShopMeta&shop=${shopId}`)
      .then(res => res.json())
      .then(data => {
        if(data.shopName) document.title = data.shopName + " Rewards";
      })
      .catch(err => console.log("Meta load error", err));
  </script>

</body>
</html>

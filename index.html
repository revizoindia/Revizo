<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revizo">
  <meta name="application-name" content="Revizo">
  <meta name="theme-color" content="#f0f4f8">
  
  <title>Revizo Rewards</title>
  
  <link rel="icon" sizes="192x192" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">
  <link rel="shortcut icon" href="https://i.ibb.co/cSFSkRSZ/20260506-124457.png">

  <link id="dynamic-manifest" rel="manifest" href="">
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f4f8; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe id="app-frame" src=""></iframe>

  <script>
    // 1. Your exact active Google Deployment Link
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyQclVaM9uGT_1bx9qdc-sDgRpey89SftQCcR_Ry7XrT9SiGk5VK5yJabJvhCdYN_jp/exec";

    // 2. Safely grab the full query string exactly as typed (e.g., ?page=cashier&shop=IQBAL)
    const rawParams = window.location.search;

    // 3. DYNAMIC APP MANIFEST FIX: This forces the phone icon to remember EXACTLY which page it was saved on.
    const manifestData = {
      "name": "Revizo Rewards",
      "short_name": "Revizo",
      "display": "standalone",
      "start_url": rawParams || "?", // <-- This is the magic fix that saves the Cashier link
      "icons": [{"src": "https://i.ibb.co/cSFSkRSZ/20260506-124457.png", "sizes": "192x192 512x512 any", "type": "image/png"}]
    };
    
    // Inject the smart manifest into the page
    const manifestString = JSON.stringify(manifestData);
    document.getElementById('dynamic-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestString);

    // 4. Inject it instantly into the iframe
    document.getElementById('app-frame').src = GAS_URL + rawParams;

    // 5. Update the browser tab dynamically
    const parsedParams = new URLSearchParams(rawParams);
    const shopId = parsedParams.get('shop') || 'SHOP1';
    
    fetch(GAS_URL + '?action=getShopMeta&shop=' + shopId)
      .then(res => res.json())
      .then(data => {
        if(data.shopName) document.title = data.shopName + " Rewards";
      })
      .catch(err => console.log("Meta load error", err));
  </script>

</body>
</html>
